name: Build VLC Glass UI APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Works whether the project is at the repo root or inside one sub-folder
      - name: Locate Gradle project
        run: |
          F=$(find . -maxdepth 2 -name settings.gradle -not -path './.git/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle not found. Upload the project files (settings.gradle, build.gradle, application/...) to the repo."
            exit 1
          fi
          D=$(dirname "$F")
          echo "Gradle project: $D"
          echo "GRADLE_ROOT=$D" >> "$GITHUB_ENV"

      # AGP 9.1.x needs JDK 17+ and Gradle 9.3.1+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;21.4.7075529

      # The project has no Gradle wrapper, so install Gradle directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare project
        working-directory: ${{ env.GRADLE_ROOT }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p libvlcjni/libvlc

      - name: Build debug APK
        working-directory: ${{ env.GRADLE_ROOT }}
        run: gradle :application:app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-glass-debug-apk
          path: ${{ env.GRADLE_ROOT }}/application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  signed-release:
    name: Signed release APKs (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Locate Gradle project
        run: |
          F=$(find . -maxdepth 2 -name settings.gradle -not -path './.git/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle not found."
            exit 1
          fi
          echo "GRADLE_ROOT=$(dirname "$F")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;21.4.7075529

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Secrets to add in GitHub: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS
      - name: Prepare project + keystore
        working-directory: ${{ env.GRADLE_ROOT }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p libvlcjni/libvlc
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        working-directory: ${{ env.GRADLE_ROOT }}
        env:
          PASSWORD_KEYSTORE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: >-
          gradle :application:app:assembleSignedRelease
          -PkeyStoreFile="$RUNNER_TEMP/release.jks"
          -Pstorealias="${{ secrets.KEY_ALIAS }}"
          --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-glass-release-apks
          path: ${{ env.GRADLE_ROOT }}/application/app/build/outputs/apk/signedRelease/*.apk
          if-no-files-found: error
