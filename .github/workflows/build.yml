name: Build VLC Glass UI APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # AGP 9.1.x needs JDK 17+ and Gradle 9.3.1+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;21.4.7075529

      # The repo has no Gradle wrapper, so install Gradle directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare project
        run: |
          # root build.gradle reads local.properties unconditionally
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # settings.gradle includes :libvlcjni:libvlc, which only exists for 'dev' builds.
          # Debug/Release pull libvlc + medialibrary from Maven, so an empty dir is enough.
          mkdir -p libvlcjni/libvlc

      - name: Build debug APK
        run: gradle :application:app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-glass-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  signed-release:
    name: Signed release APKs (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;21.4.7075529
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare project + keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p libvlcjni/libvlc
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Secrets to add in GitHub: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS
      - name: Build signed release
        env:
          PASSWORD_KEYSTORE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: >-
          gradle :application:app:assembleSignedRelease
          -PkeyStoreFile="$RUNNER_TEMP/release.jks"
          -Pstorealias="${{ secrets.KEY_ALIAS }}"
          --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-glass-release-apks
          path: application/app/build/outputs/apk/signedRelease/*.apk
          if-no-files-found: error
